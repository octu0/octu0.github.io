<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>VEVC vs H.264 Comparison</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header">
        <h1>Video Codec Comparison</h1>
    </div>
    
    <div class="controls">
        <label for="video-upload" class="btn">Upload Video</label>
        <input type="file" id="video-upload" accept="video/mp4,video/webm" style="display: none;">
        
        <label for="bitrate-input">Bitrate (kbps): </label>
        <input type="number" id="bitrate-input" value="500" step="100">
        
        <label for="framerate-input">Framerate: </label>
        <input type="number" id="framerate-input" value="30">
        
        <button id="start-btn" disabled>Start Comparison</button>
        
        <div class="seekbar-container" style="display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 15px; width: 100%;">
            <span id="time-display">0.00 / 0.00</span>
            <input type="range" id="seek-bar" min="0" max="100" value="0" step="0.1" style="flex: 1; margin: 0 10px; cursor: pointer;">
        </div>
    </div>

    <!-- Hidden video element for extracting frames -->
    <video id="source-video" playsinline muted style="display: none;"></video>
    
    <div id="buffering-indicator" style="display: none; text-align: center; background: rgba(255,165,0,0.2); color: orange; font-weight: bold; padding: 10px; margin: 10px auto; width: 50%; border-radius: 5px;">
        Buffering: Please wait...
    </div>
    
    <div class="comparison-container">
        <div class="panel">
            <h2>H.264 (WebCodecs)</h2>
            <canvas id="h264-canvas" width="640" height="360"></canvas>
            <div class="stats" id="h264-stats">Waiting...</div>
        </div>
        <div class="panel">
            <h2>VEVC (Wasm)</h2>
            <canvas id="vevc-canvas" width="640" height="360"></canvas>
            <div class="stats" id="vevc-stats">Waiting...</div>
        </div>
    </div>
    
    <script src="main.js?v=2"></script>
</body>
</html>
