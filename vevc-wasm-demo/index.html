<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="VEVC vs H.264 video codec quality comparison demo using WebAssembly">
    <title>VEVC vs H.264 Comparison</title>
    <link rel="stylesheet" href="style.css?v=7">
</head>

<body>
    <div class="header">
        <h1>Video Codec Comparison</h1>
    </div>

    <div class="controls">
        <label for="video-upload" class="btn" id="upload-label">Upload Video</label>
        <input type="file" id="video-upload" accept="video/mp4,video/webm" style="display: none;">

        <label for="bitrate-input">Bitrate (kbps): </label>
        <input type="number" id="bitrate-input" value="500" step="100">

        <label for="framerate-input">Framerate: </label>
        <input type="number" id="framerate-input" value="30">

        <button id="start-btn" disabled>Start Comparison</button>
    </div>

    <div class="playback-controls" id="playback-controls">
        <button id="play-pause-btn" class="play-pause-btn" disabled title="Play / Pause">
            <svg id="play-icon" viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
                <polygon points="6,4 20,12 6,20" />
            </svg>
            <svg id="pause-icon" viewBox="0 0 24 24" width="22" height="22" fill="currentColor" style="display:none;">
                <rect x="5" y="4" width="4" height="16" />
                <rect x="15" y="4" width="4" height="16" />
            </svg>
        </button>
        <span id="time-current" class="time-label">0:00</span>
        <div class="seekbar-wrapper">
            <input type="range" id="seek-bar" class="seek-bar" min="0" max="1000" value="0" step="1">
            <div class="seekbar-progress" id="seekbar-progress"></div>
        </div>
        <span id="time-duration" class="time-label">0:00</span>
    </div>

    <!-- Hidden video element for extracting frames -->
    <video id="source-video" playsinline muted style="display: none;"></video>

    <div id="buffering-indicator" class="buffering-indicator">
        <div class="buffering-spinner"></div>
        <span>Buffering…</span>
    </div>

    <div class="comparison-container">
        <div class="panel">
            <h2>H.264 <span class="codec-label">(WebCodecs)</span></h2>
            <canvas id="h264-canvas" width="640" height="360"></canvas>
            <div class="stats" id="h264-stats">Waiting...</div>
        </div>
        <div class="panel">
            <h2>VEVC <span class="codec-label">(Wasm)</span></h2>
            <canvas id="vevc-canvas" width="640" height="360"></canvas>
            <div class="stats" id="vevc-stats">Waiting...</div>
        </div>
    </div>

    <script src="main.js?v=8"></script>
    <div id="debug-errors" style="color:red; font-size:12px; position:fixed; bottom:10px; left:10px; z-index:9999; background:rgba(0,0,0,0.8); padding:5px; max-width:400px; max-height:100px; overflow:auto; border-radius:4px; display:none;"></div>
    <script>
        // Filter out non-fatal JavaScriptKit reference lifecycle errors
        const isKnownNonFatalError = (msg) => {
            return typeof msg === 'string' && msg.includes('invalid reference');
        };
        window.onerror = function(msg, url, line) {
            if (isKnownNonFatalError(msg)) return true;
            const el = document.getElementById('debug-errors');
            el.style.display = 'block';
            el.innerText += "\n[MAIN ERROR] " + msg;
        };
        window.addEventListener('unhandledrejection', (event) => {
            const msg = event.reason?.message || String(event.reason);
            if (isKnownNonFatalError(msg)) { event.preventDefault(); return; }
        });
        const originalWorker = window.Worker;
        window.Worker = function(scriptURL, options) {
            const w = new originalWorker(scriptURL, options);
            w.addEventListener('error', (err) => {
                const msg = err.message || String(err);
                if (isKnownNonFatalError(msg)) return;
                const el = document.getElementById('debug-errors');
                el.style.display = 'block';
                el.innerText += "\n[WORKER ERROR] " + msg;
            });
            return w;
        };
    </script>
</body>

</html>
